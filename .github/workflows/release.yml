name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the release job widens this for itself alone.
permissions:
  contents: read

# goreleaser's before hook runs the test suite, and the suite drives these two
# binaries. Keep them in step with ci.yml: a release that installs neither
# still passes, because the tests that need them skip -- which turns the gate
# before a tag is published into a gate that tests nothing.
env:
  TALOSCTL_VERSION: v1.14.1
  SOPS_VERSION: v3.13.3

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload archives
      packages: write # push the container image to ghcr.io
      id-token: write # the identity cosign signs with, keylessly
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from git history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install talosctl
        run: |
          os=$(uname | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m); [ "$arch" = "x86_64" ] && arch=amd64; [ "$arch" = "aarch64" ] && arch=arm64
          curl -fsSL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}/talosctl-${os}-${arch}"
          chmod +x /usr/local/bin/talosctl
          talosctl version --client

      - name: Install sops
        run: |
          os=$(uname | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m); [ "$arch" = "x86_64" ] && arch=amd64; [ "$arch" = "aarch64" ] && arch=arm64
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.${os}.${arch}"
          chmod +x /usr/local/bin/sops
          sops --version

      # The image is multi-arch and built from one runner. Nothing in the
      # Dockerfile runs -- it copies static binaries out of upstream images --
      # so buildx crosses architectures without emulation.
      # Signing and the bill of materials. Keyless signing binds the
      # signature to this workflow's identity, so there is no key to hold.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
