name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the release job widens this for itself alone.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload archives
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from git history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
