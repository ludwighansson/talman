name: e2e-qemu

# Real virtual machines: installs, reboots, maintenance mode and an actual
# Talos upgrade. None of that runs on a hosted runner, because none of them
# reliably offer KVM, so this waits for a self-hosted one labelled `kvm` and is
# never a gate on a pull request.
on:
  workflow_dispatch:
  schedule:
    # Nightly, after the hosted suites have had their say.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  # One cluster of virtual machines per runner: two of these at once would
  # fight over the same bridge and the same addresses.
  group: e2e-qemu
  cancel-in-progress: false

env:
  TALOSCTL_VERSION: v1.14.1
  SOPS_VERSION: v3.13.3
  # Not under RUNNER_TEMP, which is emptied when a job starts: a cluster a
  # killed run left behind has to be findable by the next one.
  WORKDIR: /var/tmp/talman-e2e-qemu

jobs:
  cluster:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install talosctl and sops
        run: |
          sudo curl -fsSL -o /usr/local/bin/talosctl \
            "https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}/talosctl-linux-amd64"
          sudo curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo chmod +x /usr/local/bin/talosctl /usr/local/bin/sops
          talosctl version --client
          sops --version

      - name: Build talman
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/talman" ./cmd/talman
          sudo install -m 0755 "$RUNNER_TEMP/talman" /usr/local/bin/talman

      - name: Drive real machines
        # Root because the provisioner makes bridges and taps; -E so the
        # versions above and any proxy settings survive sudo. The script says
        # what the machines were doing if it fails, while they still exist:
        # its trap destroys them before any later step could ask.
        run: sudo -E ./hack/e2e-qemu.sh
        env:
          FROM_VERSION: v1.14.0
          TO_VERSION: v1.14.1

      - name: Leave no machines behind
        # For a run killed before the script's trap could fire, such as by the
        # timeout above. A fixed WORKDIR is what makes its state findable, here
        # and by the next run.
        if: always()
        run: |
          sudo talosctl cluster destroy --name talman-e2e-qemu --state "$WORKDIR/state" || true
          sudo rm -rf "$WORKDIR"
