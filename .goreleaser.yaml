# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: talman

# What the image carries. Named once because the label that tells an operator
# which talosctl is inside has to be the one that was built in: two constants
# spelling the same version is how an image comes to advertise a binary it does
# not contain. ci.yml installs the same pair, so what is tested is what ships.
env:
  - TALOSCTL_VERSION=v1.14.1
  - SOPS_VERSION=v3.13.3

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - id: talman
    main: ./cmd/talman
    binary: talman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ludwighansson/talman/internal/cli.Version={{ .Version }}
    # Build with a timestamp derived from the commit so archives are
    # reproducible rather than varying per build.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: talman
    ids:
      - talman
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

# The image carries talosctl and sops as well, because talman drives both and
# an image without them can lint a config and nothing else. The versions come
# from the variables above rather than the Dockerfile's defaults, so one file
# decides what a release ships.
dockers_v2:
  - id: talman
    ids:
      - talman
    dockerfile: Dockerfile
    images:
      - ghcr.io/ludwighansson/talman
    # The moving tags follow stable releases only: a `latest` that also
    # followed alphas and betas would be a trap for whoever pulls it expecting
    # stability. A template that renders empty is skipped, so a prerelease is
    # tagged with its exact version alone.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      TALOSCTL_VERSION: "{{ .Env.TALOSCTL_VERSION }}"
      SOPS_VERSION: "{{ .Env.SOPS_VERSION }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Manage Talos clusters and their configuration patches"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
      # Which talosctl is inside, without running the image: the version a
      # cluster actually meets is this one, not talman's.
      dev.talman.talosctl.version: "{{ .Env.TALOSCTL_VERSION }}"
      dev.talman.sops.version: "{{ .Env.SOPS_VERSION }}"

checksum:
  name_template: checksums.txt

# A tool that renders machine CA keys and reaches clusters with admin
# credentials should be verifiable before it is trusted. Keyless, so there is
# no private key to keep: cosign binds the signature to the workflow identity
# that produced it, recorded in the public transparency log.
#
# Verify a release with:
#
#	cosign verify-blob checksums.txt \
#	  --signature checksums.txt.sig --certificate checksums.txt.pem \
#	  --certificate-identity-regexp 'https://github.com/ludwighansson/talman/.*' \
#	  --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The checksum file is what is signed, and it covers every archive.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    artifacts: all
    output: true

# What is in each archive, for whoever has to answer that question about a
# binary they did not build.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci:"
      - Merge pull request
      - Merge branch
  # Groups take commits in the order they are listed, so breaking changes
  # come out of every type before Features and Fixes see them, and lead the
  # notes where someone upgrading will look first.
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))??!:.+$'
      order: -1
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```console
    go install github.com/ludwighansson/talman/cmd/talman@{{ .Tag }}
    ```

    talman drives the `talosctl` binary; install that too.

    Or take the image, which carries talosctl and sops with it:

    ```console
    docker run --rm --read-only --tmpfs /tmp -v "$PWD:/cluster" \
      ghcr.io/ludwighansson/talman:{{ .Version }} validate
    ```
