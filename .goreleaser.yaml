# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: talman

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - id: talman
    main: ./cmd/talman
    binary: talman
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ludwighansson/talman/internal/cli.Version={{ .Version }}
    # Build with a timestamp derived from the commit so archives are
    # reproducible rather than varying per build.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: talman
    ids:
      - talman
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

# The image carries talosctl and sops as well, because talman drives both and
# an image without them can lint a config and nothing else. Their versions are
# pinned here rather than left to the Dockerfile's defaults, so one file decides
# what a release ships; keep them in step with ci.yml, which tests against the
# same pair.
dockers_v2:
  - id: talman
    ids:
      - talman
    dockerfile: Dockerfile
    images:
      - ghcr.io/ludwighansson/talman
    # No `latest`: every release so far is a prerelease, and a latest tag that
    # follows alphas is a trap for whoever pulls it expecting stability.
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      TALOSCTL_VERSION: v1.14.1
      SOPS_VERSION: v3.13.3
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Manage Talos clusters and their configuration patches"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
      # Which talosctl is inside, without running the image: the version a
      # cluster actually meets is this one, not talman's.
      dev.talman.talosctl.version: v1.14.1
      dev.talman.sops.version: v3.13.3

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```console
    go install github.com/ludwighansson/talman/cmd/talman@{{ .Tag }}
    ```

    talman drives the `talosctl` binary; install that too.

    Or take the image, which carries talosctl and sops with it:

    ```console
    docker run --rm --read-only --tmpfs /tmp -v "$PWD:/cluster" \
      ghcr.io/ludwighansson/talman:{{ .Version }} validate
    ```
